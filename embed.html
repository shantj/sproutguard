<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Time Calculator (embeddable widget)</title>
<meta name="robots" content="noindex, follow">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0f1511;color:#e8f0ea;padding:18px;
  }
  .w{max-width:560px;margin:0 auto}
  h1{font-size:16px;margin:0 0 4px;font-weight:600;color:#e8f0ea}
  .sub{font-size:12px;color:#8fa396;margin:0 0 16px}
  label{display:block;font-size:13px;color:#b9c9be;margin:14px 0 6px}
  .val{color:#5ec87e;font-weight:600}
  input[type=range]{width:100%;accent-color:#5ec87e}
  input[type=number]{
    width:80px;background:#1a231d;border:1px solid #2c3a30;color:#e8f0ea;
    border-radius:6px;padding:6px 8px;font-size:14px;
  }
  .out{
    background:#141c17;border:1px solid #2c3a30;border-radius:10px;
    padding:16px;margin-top:18px;text-align:center;
  }
  .big{font-size:44px;font-weight:700;color:#5ec87e;line-height:1.1}
  .lbl{font-size:12px;color:#8fa396;margin-top:6px}
  .verdict{font-size:13px;color:#b9c9be;margin-top:12px;line-height:1.5}
  .foot{
    margin-top:16px;padding-top:12px;border-top:1px solid #2c3a30;
    font-size:12px;color:#8fa396;display:flex;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
  }
  .foot a{color:#5ec87e;text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .foot a:visited{color:#5ec87e}
</style>
</head>
<body>
<div class="w">
  <h1>How much of your life goes to your phone?</h1>
  <p class="sub">Runs entirely in your browser. Nothing is sent anywhere.</p>

  <label for="hrs">Daily screen time: <span class="val" id="hrsv">4 hours</span></label>
  <input type="range" id="hrs" min="0.5" max="12" step="0.25" value="4">

  <label for="waste">Share of that you'd take back if you could: <span class="val" id="wastev">60%</span></label>
  <input type="range" id="waste" min="0" max="100" step="5" value="60">

  <label for="age">Your age: <input type="number" id="age" min="10" max="99" value="30"></label>

  <div class="out">
    <div class="big" id="o4">—</div>
    <div class="lbl">waking years of your remaining life, at this rate</div>
    <p class="verdict" id="verdict">—</p>
  </div>

  <div class="foot">
    <span>Waking hours = 16/day. Life expectancy = 80.</span>
    <a id="src" href="https://shantj.github.io/sproutguard/screen-time-calculator.html?ct=embed" target="_blank" rel="noopener">Full calculator &rarr;</a>
  </div>
</div>

<script>
(function(){
  var hrs=document.getElementById('hrs'),waste=document.getElementById('waste'),age=document.getElementById('age');
  var LIFE=80, WAKE=16;
  function fmt(n,d){return n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});}
  function calc(){
    var h=parseFloat(hrs.value)||0;
    var w=(parseFloat(waste.value)||0)/100;
    var a=parseFloat(age.value); if(!isFinite(a)||a<1){a=30;}
    var perYear=h*365;
    var left=Math.max(LIFE-a,0);
    var years=(perYear*w*left)/(365*WAKE);

    document.getElementById('hrsv').textContent=fmt(h,2).replace(/\.00$/,'').replace(/0$/,'').replace(/\.$/,'')+' hours';
    document.getElementById('wastev').textContent=Math.round(w*100)+'%';
    document.getElementById('o4').textContent=fmt(years,1);

    var v;
    if(left<=0){ v='At 80 or beyond, the remaining-life figure stops being the useful one.'; }
    else if(years<0.5){ v='Under half a waking year. Whatever you are doing, it is working.'; }
    else if(years<2){ v='Roughly a long sabbatical, spent in ninety-second instalments.'; }
    else if(years<5){ v='Comparable to a full university degree, handed over in pieces too small to notice.'; }
    else if(years<10){ v='Longer than most careers spend at any single employer.'; }
    else { v='Past ten years the daily figure has stopped being a useful unit — this is a structural problem, not a discipline one.'; }
    document.getElementById('verdict').textContent=v;

    var link=document.getElementById('src');
    link.href='https://shantj.github.io/sproutguard/screen-time-calculator.html?h='+hrs.value+'&w='+waste.value+'&a='+age.value+'&ct=embed';
  }
  [hrs,waste,age].forEach(function(el){el.addEventListener('input',calc);});
  calc();

  function postHeight(){
    try{
      var h=document.documentElement.scrollHeight;
      if(window.parent&&window.parent!==window){
        window.parent.postMessage({sproutguardEmbedHeight:h},'*');
      }
    }catch(e){}
  }
  postHeight();
  window.addEventListener('resize',postHeight);
  [hrs,waste,age].forEach(function(el){el.addEventListener('input',postHeight);});
})();
</script>
</body>
</html>
